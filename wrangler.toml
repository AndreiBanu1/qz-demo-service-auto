name = "turbo-garaj-demo"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "turbo-garaj-demo"
database_id = "01e21357-f381-45bf-a004-ac089ecbcac0"
migrations_dir = "migrations"

[vars]
# Production values. Local values live in .dev.vars (see .dev.vars.example) and override these.
MAIL_MODE = "sandbox"
SITE_URL = "https://turbo-garaj-demo.andreibanu97.workers.dev"

[triggers]
crons = ["0 5 * * *", "0 2 * * *"]
